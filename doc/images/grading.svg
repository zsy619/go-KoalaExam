  <text x="595" y="80" font-size="11" fill="#909399">@student4</text>
  <text x="485" y="105" font-size="12" fill="#909399">考试：</text>
  <text x="525" y="105" font-size="12" fill="#303133">算法能力测试（随时考）</text>
  
  <!-- 进度 -->
  <rect x="475" y="130" width="310" height="20" rx="10" fill="#ecf5ff"/>
  <rect x="475" y="130" width="186" height="20" rx="10" fill="#67c23a"/>
  <text x="630" y="145" text-anchor="middle" font-size="11" fill="#fff">已批改 3/5 题</text>
  
