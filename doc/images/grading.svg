  <text x="516" y="184" text-anchor="middle" font-size="10" fill="#e6a23c">简答</text>
  <text x="538" y="184" font-size="11" fill="#303133">请描述快速排序的核心思想</text>
  <rect x="510" y="193" width="0" height="0"/>
  
  <text x="485" y="207" font-size="10" fill="#909399">考生答案：</text>
  <text x="540" y="207" font-size="10" fill="#303133">分治法思想，选取基准...</text>
  
  <text x="485" y="222" font-size="10" fill="#909399">参考答案：</text>
  <text x="540" y="222" font-size="10" fill="#67c23a">分治 + 递归 + 基准元素选择</text>
  
  <text x="485" y="245" font-size="10" fill="#909399">评分：</text>
  <rect x="510" y="234" width="50" height="22" rx="2" fill="#ecf5ff" stroke="#409eff"/>
  <text x="535" y="248" text-anchor="middle" font-size="11" fill="#409eff" font-weight="600">8</text>
  <text x="565" y="248" font-size="11" fill="#909399">/ 10 分</text>
  <text x="485" y="270" font-size="10" fill="#909399">评语：思路清晰，边界处理得当</text>
  
  <!-- 第2题 -->
  <rect x="475" y="290" width="310" height="115" rx="4" fill="#fafbfc"/>
  <text x="485" y="310" font-size="11" font-weight="600" fill="#409eff">2.</text>
  <rect x="498" y="298" width="35" height="14" rx="2" fill="#fdf6ec"/>
  <text x="516" y="309" text-anchor="middle" font-size="10" fill="#e6a23c">简答</text>
  <text x="538" y="309" font-size="11" fill="#303133">解释 TCP 三次握手过程</text>
  
  <text x="485" y="332" font-size="10" fill="#909399">考生答案：客户端发送 SYN...</text>
  <text x="485" y="347" font-size="10" fill="#909399">参考答案：SYN → SYN+ACK → ACK</text>
  
  <text x="485" y="370" font-size="10" fill="#909399">评分：</text>
  <rect x="510" y="359" width="50" height="22" rx="2" fill="#ecf5ff" stroke="#409eff"/>
  <text x="535" y="373" text-anchor="middle" font-size="11" fill="#409eff" font-weight="600">7</text>
  <text x="565" y="373" font-size="11" fill="#909399">/ 10 分</text>
  
  <!-- 底部 -->
  <rect x="475" y="460" width="310" height="36" rx="4" fill="#ecf5ff"/>
  <text x="555" y="482" text-anchor="middle" font-size="12" fill="#409eff" font-weight="600">提交批改</text>
